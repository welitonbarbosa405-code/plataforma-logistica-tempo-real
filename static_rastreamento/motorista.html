<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuhn Bus — Motorista</title>
    <meta name="theme-color" content="#2E3440">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KuhnBus Motorista">
    <link rel="manifest" href="/manifest.json">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAK5tNlfXqF1bin7urWetpudnIj7lKzl-0&language=pt-BR"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Segoe UI',sans-serif; background:#1a1a2e; min-height:100vh; color:white; }

        /* LOGIN */
        .login-screen {
            min-height:100vh; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:linear-gradient(160deg,#2E3440 0%,#1a1a2e 100%);
            padding:30px 24px;
        }
        .login-logo { font-size:72px; margin-bottom:8px; }
        .login-title { font-size:28px; font-weight:800; margin-bottom:4px; }
        .login-sub { color:rgba(255,255,255,0.7); font-size:14px; margin-bottom:40px; }
        .login-card {
            background:white; border-radius:20px; padding:32px 24px;
            width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
        }
        .login-card label { display:block; font-size:13px; font-weight:600; color:#2E3440; margin-bottom:8px; }
        .login-card input {
            width:100%; padding:14px 16px; border:2px solid #E8E8E8; border-radius:12px;
            font-size:20px; font-weight:700; letter-spacing:2px; text-align:center;
            color:#2E3440; margin-bottom:20px; transition:border-color 0.2s;
        }
        .login-card input:focus { outline:none; border-color:#2E3440; }
        .btn-login {
            width:100%; padding:16px; background:#2E3440; color:white;
            border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer;
        }
        .btn-login:active { transform:scale(0.98); opacity:0.9; }
        .login-error { color:#ED1C24; font-size:13px; text-align:center; margin-top:12px; font-weight:600; display:none; }

        /* APP */
        .app-screen { display:none; min-height:100vh; background:#F5F5F5; }

        /* Header motorista */
        .motor-header {
            background:linear-gradient(135deg,#2E3440,#1a1a2e);
            color:white; padding:16px 20px;
            padding-top:max(16px,env(safe-area-inset-top));
            display:flex; align-items:center; justify-content:space-between;
        }
        .motor-header h2 { font-size:18px; font-weight:700; }
        .motor-header p { font-size:12px; opacity:0.7; margin-top:2px; }
        .btn-sair {
            background:rgba(255,255,255,0.15); border:none; color:white;
            padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer;
        }

        /* Status viagem */
        .viagem-status {
            margin:16px; border-radius:16px; padding:20px;
            box-shadow:0 2px 12px rgba(0,0,0,0.1);
            background:white;
        }
        .viagem-parada {
            background:linear-gradient(135deg,#F8F8F8,#FFFFFF);
            border:2px dashed #D0B580;
        }
        .viagem-ativa {
            background:linear-gradient(135deg,#E1F5EE,#FFFFFF);
            border:2px solid #10b981;
        }

        /* Botão iniciar viagem */
        .btn-iniciar {
            width:100%; padding:20px; border:none; border-radius:14px;
            font-size:18px; font-weight:800; cursor:pointer; margin:0 0 12px 0;
            transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:10px;
        }
        .btn-iniciar-ida { background:#ED1C24; color:white; }
        .btn-iniciar-volta { background:#2E3440; color:white; }
        .btn-iniciar:active { transform:scale(0.98); }
        .btn-encerrar {
            width:100%; padding:14px; border:2px solid #ED1C24; background:white;
            color:#ED1C24; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
        }

        /* Info ônibus */
        .bus-card {
            margin:0 16px 16px 16px; background:white; border-radius:16px;
            padding:16px; box-shadow:0 2px 12px rgba(0,0,0,0.08);
        }
        .bus-card-title { font-size:13px; font-weight:700; color:#2E3440; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px; }
        .bus-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .bus-item { background:#F8F8F8; border-radius:10px; padding:12px; }
        .bus-item-label { font-size:11px; color:#888; text-transform:uppercase; margin-bottom:4px; }
        .bus-item-value { font-size:15px; font-weight:700; color:#2E3440; }

        /* Lista passageiros */
        .passageiros-card {
            margin:0 16px 16px 16px; background:white; border-radius:16px;
            padding:16px; box-shadow:0 2px 12px rgba(0,0,0,0.08);
        }
        .passageiro-item {
            display:flex; align-items:center; justify-content:space-between;
            padding:12px 0; border-bottom:1px solid #F5F5F5; gap:10px;
        }
        .passageiro-item:last-child { border-bottom:none; }
        .passageiro-num {
            width:28px; height:28px; border-radius:50%; background:#ED1C24;
            color:white; font-size:12px; font-weight:700; display:flex;
            align-items:center; justify-content:center; flex-shrink:0;
        }
        .passageiro-info { flex:1; }
        .passageiro-nome { font-size:14px; font-weight:600; color:#2E3440; }
        .passageiro-end { font-size:11px; color:#888; margin-top:2px; }
        .passageiro-hora { font-size:12px; color:#185FA5; font-weight:600; margin-top:2px; }
        .btn-embarque {
            padding:8px 14px; border:none; border-radius:8px;
            font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
        }
        .btn-embarque-ok { background:#10b981; color:white; }
        .btn-embarque-pendente { background:#E8E8E8; color:#2E3440; }

        /* GPS status bar */
        .gps-bar {
            position:sticky; top:0; z-index:100;
            padding:10px 16px; font-size:13px; font-weight:600;
            display:flex; align-items:center; gap:8px;
        }
        .gps-ativo { background:#10b981; color:white; }
        .gps-inativo { background:#f59e0b; color:white; }
        .gps-dot { width:8px; height:8px; border-radius:50%; background:white; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .loading { display:flex; align-items:center; justify-content:center; padding:40px; color:#888; gap:10px; }
        .spinner { width:20px; height:20px; border:3px solid #E8E8E8; border-top-color:#2E3440; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-logo">🚌</div>
        <div class="login-title">Kuhn Bus</div>
        <div class="login-sub">Painel do Motorista</div>
        <div class="login-card">
            <label>Sua Matrícula</label>
            <input type="text" id="inputMatricula" placeholder="Ex: 001234"
                autocomplete="off" inputmode="text"
                onkeydown="if(event.key==='Enter') fazerLogin()">
            <button class="btn-login" onclick="fazerLogin()">Entrar como Motorista →</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- APP -->
    <div class="app-screen" id="appScreen">

        <!-- Header -->
        <div class="motor-header">
            <div>
                <h2 id="nomeMotorista">Motorista</h2>
                <p id="infoOnibus">—</p>
            </div>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>

        <!-- GPS Bar -->
        <div class="gps-bar gps-inativo" id="gpsBar">
            <div class="gps-dot"></div>
            <span id="gpsTexto">GPS aguardando...</span>
        </div>

        <!-- Loading -->
        <div class="loading" id="appLoading">
            <div class="spinner"></div> Carregando...
        </div>

        <!-- Conteúdo -->
        <div id="appConteudo" style="display:none;padding-bottom:30px;">

            <!-- Status da Viagem -->
            <div class="viagem-status viagem-parada" id="viagemCard">
                <div style="text-align:center;margin-bottom:16px;">
                    <div style="font-size:13px;color:#888;margin-bottom:8px;">SELECIONE O SENTIDO DA VIAGEM</div>
                    <button class="btn-iniciar btn-iniciar-ida" onclick="iniciarViagem('ida')">
                        🌅 Iniciar IDA — Para Kuhn Brasil
                    </button>
                    <button class="btn-iniciar btn-iniciar-volta" onclick="iniciarViagem('volta')">
                        🌆 Iniciar VOLTA — Para Casa
                    </button>
                </div>
            </div>

            <!-- Info do Ônibus -->
            <div class="bus-card">
                <div class="bus-card-title">🚌 Informações da Linha</div>
                <div class="bus-grid">
                    <div class="bus-item">
                        <div class="bus-item-label">Linha</div>
                        <div class="bus-item-value" id="busNome">—</div>
                    </div>
                    <div class="bus-item">
                        <div class="bus-item-label">Placa</div>
                        <div class="bus-item-value" id="busPlaca">—</div>
                    </div>
                    <div class="bus-item">
                        <div class="bus-item-label">🌅 Saída IDA</div>
                        <div class="bus-item-value" id="busHorarioIda">—</div>
                    </div>
                    <div class="bus-item">
                        <div class="bus-item-label">🌆 Saída VOLTA</div>
                        <div class="bus-item-value" id="busHorarioVolta">—</div>
                    </div>
                </div>
            </div>

            <!-- Passageiros -->
            <div class="passageiros-card">
                <div class="bus-card-title">👥 Passageiros</div>
                <div id="listaPassageiros">
                    <div style="text-align:center;padding:20px;color:#888;font-size:13px;">
                        Inicie a viagem para ver os passageiros
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API = window.location.origin;
        let _motorista = null;
        let _gpsWatch = null;
        let _viagemAtiva = false;
        let _sentido = 'ida';

        // ===== LOGIN =====
        async function fazerLogin() {
            const matricula = document.getElementById('inputMatricula').value.trim();
            const errEl = document.getElementById('loginError');
            errEl.style.display = 'none';
            if (!matricula) { errEl.textContent = 'Digite sua matrícula'; errEl.style.display = 'block'; return; }

            const btn = document.querySelector('.btn-login');
            btn.textContent = 'Entrando...'; btn.disabled = true;

            try {
                const res = await fetch(`${API}/api/motorista/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ matricula })
                });
                const data = await res.json();
                if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
                _motorista = data;
                localStorage.setItem('motoristaLogado', JSON.stringify(data));
                mostrarApp();
            } catch(e) {
                errEl.textContent = 'Erro ao conectar. Verifique sua internet.';
                errEl.style.display = 'block';
            } finally {
                btn.textContent = 'Entrar como Motorista →'; btn.disabled = false;
            }
        }

        function sair() {
            pararGPS();
            if (_viagemAtiva) encerrarViagem();
            localStorage.removeItem('motoristaLogado');
            _motorista = null;
            document.getElementById('appScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('inputMatricula').value = '';
        }

        // ===== APP =====
        function mostrarApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            document.getElementById('appLoading').style.display = 'none';
            document.getElementById('appConteudo').style.display = 'block';

            document.getElementById('nomeMotorista').textContent = _motorista.nome.split(' ')[0];
            document.getElementById('infoOnibus').textContent = `${_motorista.onibus_nome} — ${_motorista.placa}`;
            document.getElementById('busNome').textContent = _motorista.onibus_nome || '—';
            document.getElementById('busPlaca').textContent = _motorista.placa || '—';
            document.getElementById('busHorarioIda').textContent = _motorista.horario_saida ? _motorista.horario_saida.substring(0,5) : '--:--';
            document.getElementById('busHorarioVolta').textContent = _motorista.horario_saida_volta ? _motorista.horario_saida_volta.substring(0,5) : '--:--';

            iniciarGPS();
        }

        // ===== GPS =====
        function iniciarGPS() {
            if (!navigator.geolocation) {
                atualizarGPSBar(false, 'GPS não disponível neste dispositivo');
                return;
            }
            _gpsWatch = navigator.geolocation.watchPosition(
                pos => onGPSRecebido(pos),
                err => atualizarGPSBar(false, 'GPS: Erro — ' + (err.message || 'sem sinal')),
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
            );
        }

        function pararGPS() {
            if (_gpsWatch) { navigator.geolocation.clearWatch(_gpsWatch); _gpsWatch = null; }
            atualizarGPSBar(false, 'GPS parado');
        }

        async function onGPSRecebido(pos) {
            atualizarGPSBar(true, `GPS ativo — ${pos.coords.accuracy.toFixed(0)}m precisão`);
            if (!_viagemAtiva) return;
            try {
                await fetch(`${API}/api/gps`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        onibus_id: _motorista.onibus_id,
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        velocidade: pos.coords.speed || 0,
                        precisao: pos.coords.accuracy
                    })
                });
            } catch(e) { console.warn('Erro ao enviar GPS:', e); }
        }

        function atualizarGPSBar(ativo, texto) {
            const bar = document.getElementById('gpsBar');
            const txt = document.getElementById('gpsTexto');
            bar.className = `gps-bar ${ativo ? 'gps-ativo' : 'gps-inativo'}`;
            txt.textContent = texto;
        }

        // ===== VIAGEM =====
        async function iniciarViagem(sentido) {
            _sentido = sentido;
            try {
                await fetch(`${API}/api/viagem/iniciar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        onibus_id: _motorista.onibus_id,
                        matricula: _motorista.matricula,
                        sentido
                    })
                });
                _viagemAtiva = true;

                const card = document.getElementById('viagemCard');
                card.className = 'viagem-status viagem-ativa';
                const sentidoTexto = sentido === 'ida' ? '🌅 IDA — Para Kuhn Brasil' : '🌆 VOLTA — Para Casa';
                card.innerHTML = `
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
                        <div style="width:12px;height:12px;border-radius:50%;background:#10b981;animation:pulse 1.5s infinite;"></div>
                        <div>
                            <div style="font-weight:700;color:#0F6E56;font-size:15px;">Viagem em andamento</div>
                            <div style="font-size:12px;color:#888;">${sentidoTexto} · Iniciada agora</div>
                        </div>
                    </div>
                    <button class="btn-encerrar" onclick="encerrarViagem()">⏹ Encerrar Viagem</button>`;

                carregarPassageiros();
            } catch(e) {
                alert('Erro ao iniciar viagem. Tente novamente.');
            }
        }

        async function encerrarViagem() {
            if (!confirm('Deseja encerrar a viagem?')) return;
            try {
                await fetch(`${API}/api/viagem/encerrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ onibus_id: _motorista.onibus_id })
                });
                _viagemAtiva = false;
                const card = document.getElementById('viagemCard');
                card.className = 'viagem-status viagem-parada';
                card.innerHTML = `
                    <div style="text-align:center;margin-bottom:16px;">
                        <div style="font-size:13px;color:#888;margin-bottom:8px;">SELECIONE O SENTIDO DA VIAGEM</div>
                        <button class="btn-iniciar btn-iniciar-ida" onclick="iniciarViagem('ida')">🌅 Iniciar IDA — Para Kuhn Brasil</button>
                        <button class="btn-iniciar btn-iniciar-volta" onclick="iniciarViagem('volta')">🌆 Iniciar VOLTA — Para Casa</button>
                    </div>`;
                document.getElementById('listaPassageiros').innerHTML = '<div style="text-align:center;padding:20px;color:#888;font-size:13px;">Inicie a viagem para ver os passageiros</div>';
            } catch(e) { alert('Erro ao encerrar viagem.'); }
        }

        // ===== PASSAGEIROS =====
        async function carregarPassageiros() {
            try {
                const res = await fetch(`${API}/api/colaborador/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ matricula: 'LIST_ALL_' + _motorista.onibus_id })
                });
            } catch(e) {}

            // Buscar passageiros do ônibus
            const res = await fetch(`${API}/api/passageiros/${_motorista.onibus_id}`);
            if (!res.ok) return;
            const passageiros = await res.json();

            const horario = _sentido === 'ida'
                ? (_motorista.horario_saida || '06:30').substring(0,5)
                : (_motorista.horario_saida_volta || '17:30').substring(0,5);
            const [hBase, mBase] = horario.split(':').map(Number);

            const lista = document.getElementById('listaPassageiros');
            if (passageiros.length === 0) {
                lista.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">Nenhum passageiro cadastrado</div>';
                return;
            }

            lista.innerHTML = passageiros.map((p, i) => {
                const totalMin = mBase + (i+1) * 7;
                const h = String(hBase + Math.floor(totalMin/60)).padStart(2,'0');
                const m = String(totalMin%60).padStart(2,'0');
                return `<div class="passageiro-item" id="pax-${p.id}">
                    <div class="passageiro-num">${i+1}</div>
                    <div class="passageiro-info">
                        <div class="passageiro-nome">${p.nome}</div>
                        <div class="passageiro-hora">🕐 ~${h}:${m}</div>
                    </div>
                    <button class="btn-embarque btn-embarque-pendente"
                        onclick="confirmarEmbarque(${p.id}, this)">
                        Embarcar
                    </button>
                </div>`;
            }).join('');
        }

        async function confirmarEmbarque(colabId, btn) {
            btn.textContent = '✅';
            btn.className = 'btn-embarque btn-embarque-ok';
            btn.disabled = true;
            const hora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
            btn.textContent = `✅ ${hora}`;
        }

        // ===== AUTO LOGIN =====
        const salvo = localStorage.getItem('motoristaLogado');
        if (salvo) { try { _motorista = JSON.parse(salvo); mostrarApp(); } catch(e) { localStorage.removeItem('motoristaLogado'); } }
    </script>
</body>
</html>
