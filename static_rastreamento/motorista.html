<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuhn Bus — Motorista</title>
    <meta name="theme-color" content="#2E3440">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAK5tNlfXqF1bin7urWetpudnIj7lKzl-0&language=pt-BR"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Segoe UI',sans-serif; background:#F5F5F5; min-height:100vh; }
        .login-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg,#2E3440 0%,#1a1a2e 100%); padding:30px 24px; }
        .login-logo { font-size:72px; margin-bottom:8px; text-align:center; }
        .login-title { color:white; font-size:28px; font-weight:800; margin-bottom:4px; text-align:center; }
        .login-sub { color:rgba(255,255,255,0.7); font-size:14px; margin-bottom:40px; text-align:center; }
        .login-card { background:white; border-radius:20px; padding:32px 24px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .login-card label { display:block; font-size:13px; font-weight:600; color:#2E3440; margin-bottom:8px; }
        .login-card input { width:100%; padding:14px 16px; border:2px solid #E8E8E8; border-radius:12px; font-size:20px; font-weight:700; letter-spacing:2px; text-align:center; color:#2E3440; margin-bottom:20px; transition:border-color 0.2s; }
        .login-card input:focus { outline:none; border-color:#2E3440; }
        .btn-login { width:100%; padding:16px; background:#2E3440; color:white; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
        .btn-login:active { transform:scale(0.98); }
        .login-error { color:#ED1C24; font-size:13px; text-align:center; margin-top:12px; font-weight:600; display:none; }
        .app-screen { display:none; min-height:100vh; }
        .motor-header { background:linear-gradient(135deg,#2E3440,#1a1a2e); color:white; padding:16px 20px; padding-top:max(16px,env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
        .motor-header h2 { font-size:18px; font-weight:700; }
        .motor-header p { font-size:12px; opacity:0.7; margin-top:2px; }
        .btn-sair { background:rgba(255,255,255,0.15); border:none; color:white; padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; }
        .gps-bar { padding:10px 16px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
        .gps-ativo { background:#10b981; color:white; }
        .gps-inativo { background:#f59e0b; color:white; }
        .gps-dot { width:8px; height:8px; border-radius:50%; background:white; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .card { margin:12px 16px; background:white; border-radius:16px; padding:16px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
        .card-title { font-size:13px; font-weight:700; color:#2E3440; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px; padding-bottom:10px; border-bottom:2px solid #D0B580; }
        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:0; }
        .info-item { background:#F8F8F8; border-radius:10px; padding:12px; }
        .info-label { font-size:11px; color:#888; text-transform:uppercase; margin-bottom:4px; }
        .info-value { font-size:15px; font-weight:700; color:#2E3440; }
        .btn-viagem { width:100%; padding:18px; border:none; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer; margin-bottom:10px; transition:all 0.2s; }
        .btn-ida { background:#ED1C24; color:white; }
        .btn-volta { background:#2E3440; color:white; }
        .btn-encerrar { width:100%; padding:14px; border:2px solid #ED1C24; background:white; color:#ED1C24; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
        .btn-viagem:active, .btn-encerrar:active { transform:scale(0.98); }
        .viagem-ativa-info { background:#E1F5EE; border:2px solid #10b981; border-radius:12px; padding:14px; margin-bottom:12px; }
        .status-dot { width:10px; height:10px; border-radius:50%; background:#10b981; display:inline-block; animation:pulse 1.5s infinite; margin-right:6px; }
        .passageiro-item { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #F5F5F5; gap:10px; }
        .passageiro-item:last-child { border-bottom:none; }
        .pax-num { width:30px; height:30px; border-radius:50%; background:#ED1C24; color:white; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .pax-num.ok { background:#10b981; }
        .pax-info { flex:1; }
        .pax-nome { font-size:14px; font-weight:600; color:#2E3440; }
        .pax-detalhe { font-size:11px; color:#888; margin-top:2px; }
        .btn-embarcar { padding:8px 14px; border:none; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
        .btn-pendente { background:#F0F0F0; color:#2E3440; }
        .btn-ok { background:#10b981; color:white; }
        .btn-ok:disabled { opacity:0.7; cursor:default; }
        .loading { display:flex; align-items:center; justify-content:center; padding:40px; color:#888; gap:10px; }
        .spinner { width:20px; height:20px; border:3px solid #E8E8E8; border-top-color:#2E3440; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .sem-dados { text-align:center; padding:30px; color:#888; font-size:13px; }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="login-logo">🚌</div>
    <div class="login-title">Kuhn Bus</div>
    <div class="login-sub">Painel do Motorista</div>
    <div class="login-card">
        <label>Sua Matrícula</label>
        <input type="text" id="inputMatricula" placeholder="Ex: 001234"
            autocomplete="off" inputmode="text"
            onkeydown="if(event.key==='Enter') fazerLogin()">
        <button class="btn-login" onclick="fazerLogin()">Entrar como Motorista →</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<div class="app-screen" id="appScreen">
    <div class="motor-header">
        <div>
            <h2 id="nomeMotorista">Motorista</h2>
            <p id="infoOnibus">—</p>
        </div>
        <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
    <div class="gps-bar gps-inativo" id="gpsBar">
        <div class="gps-dot"></div>
        <span id="gpsTexto">GPS aguardando...</span>
    </div>
    <div class="loading" id="appLoading"><div class="spinner"></div> Carregando...</div>
    <div id="appConteudo" style="display:none;padding-bottom:30px;">
        <div class="card">
            <div class="card-title">🚌 Minha Linha</div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">Linha</div><div class="info-value" id="busNome">—</div></div>
                <div class="info-item"><div class="info-label">Placa</div><div class="info-value" id="busPlaca">—</div></div>
                <div class="info-item"><div class="info-label">🌅 IDA</div><div class="info-value" id="busHorarioIda">—</div></div>
                <div class="info-item"><div class="info-label">🌆 VOLTA</div><div class="info-value" id="busHorarioVolta">—</div></div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">🗺️ Controle da Viagem</div>
            <div id="viagemConteudo">
                <p style="font-size:13px;color:#666;margin-bottom:16px;text-align:center;">Selecione o sentido para iniciar</p>
                <button class="btn-viagem btn-ida" onclick="iniciarViagem('ida')">🌅 Iniciar IDA — Para Kuhn Brasil</button>
                <button class="btn-viagem btn-volta" onclick="iniciarViagem('volta')">🌆 Iniciar VOLTA — Para Casa</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">
                👥 Passageiros
                <span id="contadorPassageiros" style="font-size:11px;color:#888;font-weight:400;text-transform:none;margin-left:6px;"></span>
            </div>
            <div id="listaPassageiros"><div class="sem-dados">Inicie a viagem para ver os passageiros</div></div>
        </div>
    </div>
</div>

<script>
const API = window.location.origin;
let _motorista = null, _gpsWatch = null, _viagemAtiva = false, _sentido = 'ida';
let _passageiros = [], _embarcados = {};

async function fazerLogin() {
    const matricula = document.getElementById('inputMatricula').value.trim();
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if (!matricula) { errEl.textContent = 'Digite sua matrícula'; errEl.style.display = 'block'; return; }
    const btn = document.querySelector('.btn-login');
    btn.textContent = 'Verificando...'; btn.disabled = true;
    try {
        const res = await fetch(`${API}/api/motorista/login`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matricula })
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error || 'Matrícula não encontrada'; errEl.style.display = 'block'; return; }
        _motorista = data;
        localStorage.setItem('motoristaLogado', JSON.stringify(data));
        mostrarApp();
    } catch(e) { errEl.textContent = 'Erro ao conectar. Verifique sua internet.'; errEl.style.display = 'block'; }
    finally { btn.textContent = 'Entrar como Motorista →'; btn.disabled = false; }
}

function sair() {
    pararGPS();
    if (_viagemAtiva) encerrarViagem(true);
    localStorage.removeItem('motoristaLogado');
    _motorista = null; _viagemAtiva = false; _embarcados = {};
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('inputMatricula').value = '';
}

function mostrarApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('appLoading').style.display = 'none';
    document.getElementById('appConteudo').style.display = 'block';
    document.getElementById('nomeMotorista').textContent = _motorista.nome.split(' ')[0];
    document.getElementById('infoOnibus').textContent = `${_motorista.onibus_nome || '—'} — ${_motorista.placa || '—'}`;
    document.getElementById('busNome').textContent = _motorista.onibus_nome || '—';
    document.getElementById('busPlaca').textContent = _motorista.placa || '—';
    document.getElementById('busHorarioIda').textContent = _motorista.horario_saida ? _motorista.horario_saida.substring(0,5) : '--:--';
    document.getElementById('busHorarioVolta').textContent = _motorista.horario_saida_volta ? _motorista.horario_saida_volta.substring(0,5) : '--:--';
    iniciarGPS();
}

function iniciarGPS() {
    if (!navigator.geolocation) { atualizarGPSBar(false, 'GPS não disponível'); return; }
    _gpsWatch = navigator.geolocation.watchPosition(
        pos => onGPSRecebido(pos),
        err => atualizarGPSBar(false, 'GPS sem sinal — verifique permissões'),
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
}

function pararGPS() {
    if (_gpsWatch !== null) { navigator.geolocation.clearWatch(_gpsWatch); _gpsWatch = null; }
    atualizarGPSBar(false, 'GPS parado');
}

async function onGPSRecebido(pos) {
    atualizarGPSBar(true, `GPS ativo — precisão ${pos.coords.accuracy.toFixed(0)}m`);
    if (!_viagemAtiva || !_motorista?.onibus_motorista_id) return;
    try {
        await fetch(`${API}/api/gps`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ onibus_id: _motorista.onibus_motorista_id, lat: pos.coords.latitude, lng: pos.coords.longitude, velocidade: pos.coords.speed || 0, precisao: pos.coords.accuracy })
        });
    } catch(e) {}
}

function atualizarGPSBar(ativo, texto) {
    document.getElementById('gpsBar').className = `gps-bar ${ativo ? 'gps-ativo' : 'gps-inativo'}`;
    document.getElementById('gpsTexto').textContent = texto;
}

async function iniciarViagem(sentido) {
    _sentido = sentido;
    try {
        await fetch(`${API}/api/viagem/iniciar`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ onibus_id: _motorista.onibus_motorista_id, matricula: _motorista.matricula, sentido })
        });
        _viagemAtiva = true; _embarcados = {};
        const st = sentido === 'ida' ? '🌅 IDA — Para Kuhn Brasil' : '🌆 VOLTA — Para Casa';
        const hr = sentido === 'ida' ? (_motorista.horario_saida || '').substring(0,5) : (_motorista.horario_saida_volta || '').substring(0,5);
        document.getElementById('viagemConteudo').innerHTML = `
            <div class="viagem-ativa-info">
                <div style="display:flex;align-items:center;margin-bottom:12px;">
                    <span class="status-dot"></span>
                    <div><div style="font-weight:700;color:#0F6E56;font-size:15px;">Viagem em andamento</div>
                    <div style="font-size:12px;color:#888;">${st} · Saída: ${hr}</div></div>
                </div>
                <button onclick="abrirRotaCompleta()" style="width:100%;padding:13px;background:#185FA5;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;">
                    🗺️ Ver Rota Completa no Google Maps
                </button>
                <button class="btn-encerrar" onclick="encerrarViagem(false)">⏹ Encerrar Viagem</button>
            </div>`;
        await carregarPassageiros(sentido);
    } catch(e) { alert('Erro ao iniciar viagem. Tente novamente.'); }
}

async function encerrarViagem(silencioso) {
    if (!silencioso && !confirm('Deseja encerrar a viagem?')) return;
    try {
        await fetch(`${API}/api/viagem/encerrar`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ onibus_id: _motorista.onibus_motorista_id })
        });
    } catch(e) {}
    _viagemAtiva = false; _embarcados = {};
    document.getElementById('viagemConteudo').innerHTML = `
        <p style="font-size:13px;color:#666;margin-bottom:16px;text-align:center;">Selecione o sentido para iniciar</p>
        <button class="btn-viagem btn-ida" onclick="iniciarViagem('ida')">🌅 Iniciar IDA — Para Kuhn Brasil</button>
        <button class="btn-viagem btn-volta" onclick="iniciarViagem('volta')">🌆 Iniciar VOLTA — Para Casa</button>`;
    document.getElementById('listaPassageiros').innerHTML = '<div class="sem-dados">Inicie a viagem para ver os passageiros</div>';
    document.getElementById('contadorPassageiros').textContent = '';
}

async function carregarPassageiros(sentido) {
    const lista = document.getElementById('listaPassageiros');
    lista.innerHTML = '<div class="loading"><div class="spinner"></div> Carregando...</div>';
    try {
        const res = await fetch(`${API}/api/passageiros/${_motorista.onibus_motorista_id}`);
        _passageiros = await res.json();
        if (sentido === 'volta') _passageiros = [..._passageiros].reverse();
        if (_passageiros.length === 0) { lista.innerHTML = '<div class="sem-dados">Nenhum passageiro nesta linha</div>'; return; }
        document.getElementById('contadorPassageiros').textContent = `(${_passageiros.length} passageiro${_passageiros.length !== 1 ? 's' : ''})`;
        const hr = sentido === 'ida' ? (_motorista.horario_saida || '06:30').substring(0,5) : (_motorista.horario_saida_volta || '17:30').substring(0,5);
        const [hB, mB] = hr.split(':').map(Number);
        lista.innerHTML = _passageiros.map((p, i) => {
            const tm = mB + (i + 1) * 7;
            const h = String(hB + Math.floor(tm/60)).padStart(2,'0');
            const m = String(tm%60).padStart(2,'0');
            const hrEst = p.horario_estimado || `${h}:${m}`;
            return `<div class="passageiro-item" id="pax-${p.id}">
                <div class="pax-num" id="num-${p.id}">${i+1}</div>
                <div class="pax-info">
                    <div class="pax-nome">${p.nome}</div>
                    <div class="pax-detalhe">Turno ${p.turno||'—'} &nbsp;·&nbsp; 🕐 ~${hrEst}</div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0;">
                    <button onclick="navegarAtePassageiro(${p.id})" style="padding:8px 10px;background:#E6F1FB;color:#185FA5;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">🗺️ Ir</button>
                    <button class="btn-embarcar btn-pendente" id="btn-${p.id}" onclick="confirmarEmbarque(${p.id}, this)">Embarcar</button>
                </div>
            </div>`;
        }).join('');
    } catch(e) { lista.innerHTML = '<div class="sem-dados">Erro ao carregar passageiros</div>'; }
}

function confirmarEmbarque(colabId, btn) {
    const hora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    btn.textContent = `✅ ${hora}`; btn.className = 'btn-embarcar btn-ok'; btn.disabled = true;
    _embarcados[colabId] = hora;
    const numEl = document.getElementById(`num-${colabId}`);
    if (numEl) numEl.className = 'pax-num ok';
    const total = _passageiros.length, emb = Object.keys(_embarcados).length;
    document.getElementById('contadorPassageiros').textContent = `(${emb}/${total} embarcados)`;
}

// Monta o melhor endereço para o Google Maps
function melhorEndereco(p) {
    const cidade = p.cidade || 'Passo Fundo';
    // Prioridade 1: Logradouro + número + CEP + cidade (mais completo e assertivo)
    if (p.logradouro) {
        const num = p.numero ? `, ${p.numero}` : '';
        const cepLimpo = p.cep ? p.cep.replace(/[^0-9]/g, '') : '';
        const cepFmt = cepLimpo.length === 8 ? ` - ${cepLimpo.substring(0,5)}-${cepLimpo.substring(5)}` : (p.cep ? ` - ${p.cep}` : '');
        return `${p.logradouro}${num}, ${cidade}, RS${cepFmt}, Brasil`;
    }
    // Prioridade 2: CEP formatado + cidade
    if (p.cep) {
        const cepLimpo = p.cep.replace(/[^0-9]/g, '');
        const cepFmt = cepLimpo.length === 8 ? `${cepLimpo.substring(0,5)}-${cepLimpo.substring(5)}` : p.cep;
        return `${cepFmt}, ${cidade}, RS, Brasil`;
    }
    // Prioridade 3: Bairro + cidade
    if (p.bairro) return `${p.bairro}, ${cidade}, RS, Brasil`;
    return null;
}

// Coordenadas fixas da Kuhn Brasil
const KUHN_END_MAPS = 'R. Arnô Pini, 1380, Invernadinha, Passo Fundo, RS, 99050-130, Brasil';

function abrirRotaCompleta() {
    if (!_passageiros || _passageiros.length === 0) {
        alert('Nenhum passageiro cadastrado nesta linha.');
        return;
    }

    // Destino: IDA = Kuhn Brasil | VOLTA = garagem
    const destinoEnd = _sentido === 'ida'
        ? KUHN_END_MAPS
        : (_motorista.ponto_origem || 'Passo Fundo, RS') + ', Brasil';
    const destino = encodeURIComponent(destinoEnd);

    // Waypoints com endereço completo
    const waypoints = _passageiros
        .map(p => melhorEndereco(p))
        .filter(Boolean)
        .slice(0, 9)
        .map(e => encodeURIComponent(e))
        .join('|');

    // Tentar usar GPS atual do motorista como origem
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => {
                const origem = encodeURIComponent(`${pos.coords.latitude},${pos.coords.longitude}`);
                let url = `https://www.google.com/maps/dir/?api=1&origin=${origem}&destination=${destino}&travelmode=driving`;
                if (waypoints) url += `&waypoints=${waypoints}`;
                window.open(url, '_blank');
            },
            () => {
                // Fallback: usar garagem como origem
                const origem = encodeURIComponent((_motorista.ponto_origem || 'Passo Fundo, RS') + ', Brasil');
                let url = `https://www.google.com/maps/dir/?api=1&origin=${origem}&destination=${destino}&travelmode=driving`;
                if (waypoints) url += `&waypoints=${waypoints}`;
                window.open(url, '_blank');
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    } else {
        const origem = encodeURIComponent((_motorista.ponto_origem || 'Passo Fundo, RS') + ', Brasil');
        let url = `https://www.google.com/maps/dir/?api=1&origin=${origem}&destination=${destino}&travelmode=driving`;
        if (waypoints) url += `&waypoints=${waypoints}`;
        window.open(url, '_blank');
    }
}

function navegarAtePassageiro(colabId) {
    const p = _passageiros.find(p => p.id === colabId);
    if (!p) return;
    const end = melhorEndereco(p);
    if (!end) { alert('Endereço não cadastrado para este colaborador.'); return; }
    const dest = encodeURIComponent(end);
    const url = `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`;
    window.open(url, '_blank');
}

const salvo = localStorage.getItem('motoristaLogado');
if (salvo) { try { _motorista = JSON.parse(salvo); mostrarApp(); } catch(e) { localStorage.removeItem('motoristaLogado'); } }
</script>
</body>
</html>
